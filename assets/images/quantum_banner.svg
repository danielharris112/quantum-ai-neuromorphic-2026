<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050515"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="qGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#9b51e0"/>
    </linearGradient>
    <linearGradient id="qCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#0a1128"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" rx="18" fill="url(#bg1)"/>

  <!-- Grid overlay -->
  <g stroke="#00f2fe" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="900" y1="0" x2="900" y2="500" />
  </g>

  <!-- Badge -->
  <rect x="400" y="40" width="400" height="34" rx="17" fill="#001845" stroke="#00f2fe" stroke-width="1.5"/>
  <text x="600" y="63" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">⚛️ QUANTUM HARDWARE &amp; NEUROMORPHIC 2026</text>

  <!-- Headline -->
  <text x="600" y="125" fill="url(#qGrad)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="900" text-anchor="middle">QUANTUM-ENHANCED AI ACCELERATION</text>
  <text x="600" y="160" fill="#90e0ef" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" text-anchor="middle">Hybrid QPU-TPU Tensor Operations &amp; Spiking Neural Architectures</text>

  <!-- 3 Cards -->
  <g transform="translate(80, 220)">
    <rect width="320" height="210" rx="16" fill="url(#qCard)" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="40" y="50" fill="#00f2fe" font-size="22">⚛️</text>
    <text x="75" y="48" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">QPU Tensor Mapping</text>
    <text x="30" y="95" fill="#94a3b8" font-family="sans-serif" font-size="14">Variational Quantum Eigensolver</text>
    <text x="30" y="125" fill="#94a3b8" font-family="sans-serif" font-size="14">10,000+ Physical Qubits fault-tolerant</text>
    <text x="30" y="155" fill="#94a3b8" font-family="sans-serif" font-size="14">Quadratic speedup on high-dim opt</text>
    <rect x="30" y="175" width="85" height="20" rx="6" fill="#0077b6" fill-opacity="0.4"/>
    <text x="72" y="189" fill="#90e0ef" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">O(sqrt(N))</text>
  </g>

  <g transform="translate(440, 220)">
    <rect width="320" height="210" rx="16" fill="url(#qCard)" stroke="#4facfe" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="40" y="50" fill="#4facfe" font-size="22">🧠</text>
    <text x="75" y="48" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">Neuromorphic Silicon</text>
    <text x="30" y="95" fill="#94a3b8" font-family="sans-serif" font-size="14">Spiking Neural Networks (SNNs)</text>
    <text x="30" y="125" fill="#94a3b8" font-family="sans-serif" font-size="14">Sub-milliwatt inference on the edge</text>
    <text x="30" y="155" fill="#94a3b8" font-family="sans-serif" font-size="14">Event-driven asynchronous compute</text>
    <rect x="30" y="175" width="105" height="20" rx="6" fill="#023e8a" fill-opacity="0.4"/>
    <text x="82" y="189" fill="#caf0f8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">100x ENERGY EFF</text>
  </g>

  <g transform="translate(800, 220)">
    <rect width="320" height="210" rx="16" fill="url(#qCard)" stroke="#9b51e0" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="40" y="50" fill="#9b51e0" font-size="22">⚡</text>
    <text x="75" y="48" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="700">Fault-Tolerant Era</text>
    <text x="30" y="95" fill="#94a3b8" font-family="sans-serif" font-size="14">Surface code error mitigation</text>
    <text x="30" y="125" fill="#94a3b8" font-family="sans-serif" font-size="14">Decoherence threshold surpassing</text>
    <text x="30" y="155" fill="#94a3b8" font-family="sans-serif" font-size="14">Real-time syndrome decoding</text>
    <rect x="30" y="175" width="95" height="20" rx="6" fill="#5a189a" fill-opacity="0.4"/>
    <text x="77" y="189" fill="#e0aaff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">MAGIC STATE</text>
  </g>
</svg>
